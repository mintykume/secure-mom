<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure MOM — Medpark</title>
<style>
  :root {
    --bg: #F6F7F5;
    --panel: #FFFFFF;
    --ink: #171B1A;
    --muted: #5B6660;
    --accent: #2F6F5E;
    --accent-ink: #FFFFFF;
    --border: #DCE1DE;
    --error: #A8412B;
    --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }
  header h1 {
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  header p {
    color: var(--muted);
    margin: 0 0 32px;
    max-width: 60ch;
  }
  form {
    border-top: 1px solid var(--border);
    padding-top: 24px;
  }
  .field {
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="file"], select {
    width: 100%;
    font-family: var(--sans);
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
  }
  button {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.55;
    cursor: default;
  }
  button:not(:disabled):hover {
    filter: brightness(1.07);
  }
  #status {
    margin-top: 28px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    min-height: 1.4em;
  }
  #status.error {
    color: var(--error);
  }
  #result {
    margin-top: 32px;
    border-top: 1px solid var(--border);
    padding-top: 24px;
    display: none;
  }
  #result h2 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  #result .meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 24px;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  th {
    color: var(--muted);
    font-weight: 500;
    font-size: 12px;
  }
  details {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
  }
  details summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
  }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    margin: 12px 0 0;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Secure MOM</h1>
    <p>Turn a meeting recording into decisions, owners, and deadlines — transcribed
       and analyzed entirely on this machine. Nothing here reaches the internet.</p>
  </header>

  <form id="run-form">
    <div class="field">
      <label for="audio">Meeting recording</label>
      <input type="file" id="audio" name="file" accept="audio/*" required>
    </div>
    <div class="field">
      <label for="meeting-type">Meeting type</label>
      <select id="meeting-type" name="meeting_type">
        <option value="medical">Medical board</option>
        <option value="executive">Executive</option>
        <option value="administrative">Administrative</option>
      </select>
    </div>
    <button type="submit" id="run-btn">Run</button>
  </form>

  <div id="status"></div>

  <section id="result">
    <h2>Minutes of Meeting</h2>
    <div class="meta" id="result-meta"></div>
    <table id="items-table">
      <thead>
        <tr><th>Decision</th><th>Owner</th><th>Deadline</th></tr>
      </thead>
      <tbody id="items-body"></tbody>
    </table>
    <details>
      <summary>Full document (also sent by email)</summary>
      <pre id="mom-raw"></pre>
    </details>
  </section>
</main>

<script>
const form = document.getElementById('run-form');
const statusEl = document.getElementById('status');
const runBtn = document.getElementById('run-btn');
const resultEl = document.getElementById('result');
const metaEl = document.getElementById('result-meta');
const itemsBody = document.getElementById('items-body');
const momRaw = document.getElementById('mom-raw');

let elapsedTimer = null;

function startElapsed() {
  const start = Date.now();
  elapsedTimer = setInterval(() => {
    const s = Math.round((Date.now() - start) / 1000);
    statusEl.textContent =
      `Processing locally — ${s}s elapsed. A 60-minute recording can take several minutes.`;
  }, 500);
}

function stopElapsed() {
  if (elapsedTimer) clearInterval(elapsedTimer);
  elapsedTimer = null;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  resultEl.style.display = 'none';
  statusEl.classList.remove('error');
  runBtn.disabled = true;
  startElapsed();

  const fd = new FormData();
  fd.append('file', document.getElementById('audio').files[0]);
  fd.append('meeting_type', document.getElementById('meeting-type').value);

  try {
    const res = await fetch('/api/process', { method: 'POST', body: fd });
    if (!res.ok) {
      throw new Error(`Server responded ${res.status}`);
    }
    const data = await res.json();

    stopElapsed();
    statusEl.textContent = `Done. Meeting ID ${data.meeting_id} — emailed to the configured recipients.`;

    metaEl.textContent =
      `meeting_id: ${data.meeting_id} · type: ${data.meeting_type} · ` +
      `detected_language: ${data.detected_language || 'unknown'}`;

    itemsBody.innerHTML = '';
    const items = data.action_items || [];
    if (items.length === 0) {
      itemsBody.innerHTML = '<tr><td colspan="3">No action items were extracted.</td></tr>';
    } else {
      for (const item of items) {
        const tr = document.createElement('tr');
        tr.innerHTML =
          `<td>${item.decision || ''}</td>` +
          `<td>${item.owner || '—'}</td>` +
          `<td>${item.deadline || '—'}</td>`;
        itemsBody.appendChild(tr);
      }
    }

    momRaw.textContent = data.mom_markdown || '';
    resultEl.style.display = 'block';
  } catch (err) {
    stopElapsed();
    statusEl.classList.add('error');
    statusEl.textContent =
      `Something went wrong: ${err.message}. Check that Ollama and the ` +
      `backend are running, and that the file is a supported audio format.`;
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
